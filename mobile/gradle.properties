org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Multiplatform
# Critical on this Windows machine: iosArm64/iosSimulatorArm64 can't be compiled here (no macOS
# toolchain). Without this flag Gradle refuses to configure the build at all when those targets
# are declared. See execution/PHASE_3_KMP_PLAN.md, "Disclosed limitation B1".
kotlin.native.ignoreDisabledTargets=true
kotlin.code.style=official

# AGP 8.9.2 is newer than the max AGP version the Kotlin 2.0.21 Gradle plugin has been tested
# against (8.5) — needed for compileSdk 36 support. Verified working; suppress the advisory warning.
kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
