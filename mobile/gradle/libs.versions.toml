[versions]
# Kotlin/AGP are independent of backend/'s versions (separate Gradle build) — chosen for
# compileSdk 36 + KMP androidTarget/iosArm64/iosSimulatorArm64 support on this toolchain.
kotlin = "2.0.21"
agp = "8.9.2"

# Aligned with backend/build.gradle.kts exactly, since multiplatform artifacts exist for all of these.
ktor = "3.0.1"
kotlinxSerialization = "1.7.3"
kotlinxDatetime = "0.6.1"
kotlinxCoroutines = "1.9.0"
# Pinned to 4.0.4, NOT the newer 4.1.0, because of a real klib ABI mismatch found by the first
# actual iOS CI compile (GitHub Actions run 35380548270, :shared:compileKotlinIosSimulatorArm64):
# koin-core 4.1.0's iosArm64/iosSimulatorArm64 klibs are produced by Kotlin compiler 2.1.20
# (klib abi_version=1.201.0), which this project's Kotlin 2.0.21 (klib abi_version=1.8.0) cannot
# resolve ("Incompatible ABI version"). Verified empirically by downloading each candidate
# koin-core-iossimulatorarm64/-iosarm64 .klib from Maven Central and inspecting its
# default/manifest entry: 4.0.4 is the newest koin-core release whose iOS klibs report
# compiler_version=2.0.21/abi_version=1.8.0 — an exact match for this catalog's own Kotlin
# version (4.0.0-4.0.4 all do; 4.1.0+ all use compiler_version=2.1.20). The 4.0.4->4.1.0 diff
# (GitHub compare 4.0.4...4.1.0) is Ktor3/scope-archetype/ViewModel-scope/Compose-only additions —
# nothing touching the basic module/single/factory/koinApplication/get API this project's `di/`
# package actually uses. See DECISIONS_LOG.md for the full writeup.
koin = "4.0.4"

# Pinned to 1.2.0, NOT the newer 1.3.0, because of the SAME class of real klib ABI mismatch as
# koin-core above (see koin's version comment) — found by the third actual iOS CI compile
# (GitHub Actions run 35383136829, :shared:compileKotlinIosSimulatorArm64):
# multiplatform-settings 1.3.0's iosArm64/iosSimulatorArm64 klibs are produced by Kotlin compiler
# 2.1.0 (klib abi_version=1.201.0), incompatible with this project's Kotlin 2.0.21 (klib
# abi_version=1.8.0). Verified empirically the same way: downloaded each candidate
# multiplatform-settings-iossimulatorarm64 .klib from Maven Central going backward from 1.3.0 and
# inspected its default/manifest entry — 1.2.0 is the newest release whose iOS klib reports
# abi_version=1.8.0 (compiler_version=2.0.0; no release in this catalog's history is an exact
# compiler_version=2.0.21 match the way koin-core 4.0.4 was, so this is the "newest ABI <= 1.8.0"
# fallback the koin comment above also describes). 1.1.1/1.1.0/1.0.0 are also abi_version=1.8.0 but
# older still. Cross-checked 1.2.0's published klib.api against IosPreferenceStore.kt's actual
# usage (Settings, NSUserDefaultsSettings(NSUserDefaults), getString/putString) — all present,
# unchanged. The 1.2.0->1.3.0 diff (GitHub compare v1.2.0...v1.3.0) is CI/build-tooling churn plus
# additive API surface in unrelated modules (multiplatform-settings-coroutines/-datastore/
# -serialization) — nothing touching the basic Settings/NSUserDefaultsSettings API this project's
# `settings/` package actually uses. See DECISIONS_LOG.md for the full writeup.
multiplatformSettings = "1.2.0"

# Task 1 (:androidApp scaffold): Compose is wired via the Kotlin 2.0+ K2 compiler plugin
# (org.jetbrains.kotlin.plugin.compose) rather than the pre-2.0 composeOptions.
# kotlinCompilerExtensionVersion mechanism, which no longer applies. The plugin's own version
# tracks the Kotlin Gradle plugin version 1:1 (see `kotlin-compose` below, version.ref = kotlin).
# composeBom pins a BOM release contemporaneous with Kotlin 2.0.21 (Oct 2024) — with the compiler
# now bundled into the Kotlin toolchain, the strict BOM/Kotlin compatibility matrix that existed
# pre-2.0 no longer applies, but a same-era BOM keeps every Compose artifact resolved from it
# (ui/material3/ui-tooling-preview) verified-compatible with this Kotlin version.
composeBom = "2024.10.01"
androidxActivityCompose = "1.9.3"

# Task 4 (F5 fix-up): LocaleController directly imports androidx.core.os.LocaleListCompat, which
# previously resolved only transitively via activity-compose — matching this catalog's convention
# (see androidxLifecycle's comment below) of an explicit entry for every directly-used library.
# Pinned to the version already resolved transitively (verified via
# `.\gradlew.bat :androidApp:dependencies`) rather than guessed.
androidxCoreKtx = "1.13.1"

# Task 4: AppSessionViewModel (session-state bootstrap plumbing) needs a plain ViewModel +
# viewModelScope + Compose's viewModel() collection helper. Already present transitively (via
# activity-compose) at 2.9.0 — pinned explicitly here since this module directly imports its APIs,
# matching this catalog's convention of an explicit entry for every directly-used library.
androidxLifecycle = "2.9.0"

# Task 4 (TokenStorage): androidx.security:security-crypto's EncryptedSharedPreferences was
# evaluated and rejected — it has sat at 1.1.0-alpha06 with no stable release for years, which
# this catalog's policy of pinning every other dependency to a stable release (Ktor 3.0.1,
# coroutines 1.9.0, koin 4.1.0, ...) treats as "problematic to add" per
# execution/PHASE_3_KMP_PLAN.md Task 4's explicit escape hatch. Keystore-wrapped DataStore
# (AndroidTokenStorage) uses this instead — see that class's kdoc.
androidxDatastore = "1.1.1"

# Task 2 (:androidApp theme token drift test): AGP's testDebugUnitTest task runs against JUnit4
# by default — same convention as every other Android app module, not a new testing framework.
junit = "4.13.2"

# Task 4 (Part D): the real-Keystore instrumented test needs to run as connectedDebugAndroidTest
# on a real device/emulator (not the JVM-only testDebugUnitTest surface) — androidx.test's runner +
# JUnit4 integration are the minimal artifacts for that. Test-only (androidTestImplementation),
# nothing production.
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# Task 15: SKIE (Swift Kotlin Interface Enhancer) generates idiomatic Swift bindings (sealed
# classes -> Swift enums, suspend fun -> async/await, Flow -> AsyncSequence) for the public
# façade. Requires a macOS host to actually run (Kotlin/Native compilation) — the plugin
# application itself is host-guarded in shared/build.gradle.kts (disclosed limitation B1).
skie = "0.9.5"

# Task 6 (:androidApp navigation shell): navigation-compose was not yet a dependency of this
# module. Pinned to 2.8.3 — verified (`dl.google.com/dl/android/maven2/.../maven-metadata.xml` +
# each candidate release's own `Last-Modified` header) as the navigation-compose release
# contemporaneous with the already-pinned `composeBom = "2024.10.01"` (BOM published 2024-10-30;
# 2.8.3 published 2024-10-16, the latest navigation-compose release before that BOM date — 2.8.4
# wasn't published until 2024-11-13, after this BOM). 2.8.x is the first line with stable
# type-safe (`@Serializable`) route support, which this task's navigation graph uses (see
# `navigation/Destinations.kt`'s kdoc) — hence the `kotlinSerialization` plugin/
# `kotlinx-serialization-core` dependency below, newly applied to this module for the same reason.
androidxNavigation = "2.8.3"

# Task 8 (component kit B — CourseThumbnail): Coil is the standard Compose image-loading library;
# no equivalent already exists in this module. Pinned to 2.7.0 — the last Coil 2.x (Android/JVM-only,
# matching this plain-Android :androidApp module, not the Coil 3.x multiplatform line which :shared
# would need instead) stable release, contemporaneous with this catalog's `composeBom = "2024.10.01"`
# (Coil 2.7.0 published 2024-08-14, well before that BOM's 2024-10-30 cut, and its own Compose UI
# dependency floor is comfortably below this project's Compose BOM version) — a stable release per
# this catalog's own "no alpha/beta pins" policy (see androidxDatastore's comment above for that
# policy's precedent).
coil = "2.7.0"

# Task 13 (D85 "Dependencies to add"): the ExoPlayer/Media3 playback controller. Pinned to 1.4.1 —
# its POM published 2024-08-27, the latest media3 release preceding this catalog's `composeBom =
# "2024.10.01"` (published 2024-10-30; 1.5.0 is 2024-11-25, after this BOM), same reasoning already
# established for androidxNavigation above. media3 1.4.1 needs compileSdk >= 34 (this module is 36),
# minSdk >= 21 (this module is 26), Java 8 (this module is 11) — all satisfied, no Compose dependency
# at all so the Compose BOM is not a constraint.
media3 = "1.4.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# Task 5: SessionManager's single-flight-refresh concurrency test needs runTest/TestScope to fire
# genuinely concurrent async{} callers deterministically (commonTest only — never a commonMain dependency).
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
# Task 1 (:androidApp): pinned to the SAME koin version already used by :shared's koin-core —
# deliberately not a second Koin version. (Was "4.1.0"; see koin's version comment above for why
# this catalog now pins 4.0.4 instead.)
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Task 2 (:androidApp theme token drift test): plain JUnit4, the AGP unit-test-task default.
junit = { module = "junit:junit", version.ref = "junit" }

# Task 4 (Part D): see androidxTestJunit/androidxTestRunner's version comment above.
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

# Task 1 (:androidApp): Compose BOM — see composeBom's version comment above for why a same-era
# BOM was chosen instead of chasing strict Kotlin-compiler-version compatibility (no longer a thing
# post-Kotlin-2.0). ui/material3/ui-tooling-preview versions all come from this BOM (no explicit
# version.ref on those three).
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
# Task 4 (F5 fix-up): see androidxCoreKtx's version comment above.
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
# Task 4: see androidxLifecycle's version comment above.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
# Task 13 C3 review finding (round 6): CoursePlayerViewModel.Factory needs ProcessLifecycleOwner
# (whole-process foreground/background detection, decoupled from any one Activity/composition's own
# lifetime — see CoursePlayerViewModel's `registerProcessBackgroundListener` kdoc) — not resolved
# transitively by anything else in this catalog, so pinned explicitly at the same androidxLifecycle
# version as the other directly-used lifecycle artifacts, per this catalog's own convention.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
# Task 5 (component kit A): Compose UI instrumented tests (Button/TextField/PasswordField/Select/
# Tabs) — no Robolectric/Compose-testing setup existed before this task (verified: Tasks 1-4 only
# ever added plain JUnit4 `testDebugUnitTest` + real-device `connectedDebugAndroidTest` for
# Keystore, per `AndroidTokenStorageInstrumentedTest`'s own kdoc). These follow that same
# real-device-instrumented convention rather than introducing Robolectric as a second, new test
# framework. Both versions come from the already-declared `composeBom` platform, no version.ref.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Task 6: the navigation shell — see androidxNavigation's version comment above.
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
# Task 6: navigation-compose's type-safe (`@Serializable`) routes need the kotlinx-serialization
# runtime at compile+run time — same version as :shared's own kotlinx-serialization-json (no new
# version introduced), just the `-core` artifact this module didn't previously depend on directly.
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Task 8 (component kit B — CourseThumbnail): see coil's version comment above.
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Task 13 (D85 Decision 1/2/"Dependencies to add"): three explicit entries — this module imports
# from each directly (Player/MediaItem/PlaybackException from media3-common,
# ResolvingDataSource/DefaultDataSource from media3-datasource), matching this catalog's own
# convention (see androidx-core-ktx's comment above). Deliberately NOT added: media3-ui (D85
# Decision 3), media3-session (no background playback/MediaSession in MVP), media3-datasource-okhttp
# (the default HttpURLConnection data source already honours the debug cleartext exception for
# 10.0.2.2, see D85's "Dependencies to add").
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Task 1 (:androidApp): plain Kotlin/JVM-on-Android plugin (androidApp is not a KMP module, unlike
# :shared) — same Kotlin version as the rest of this catalog.
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
# Task 1 (:androidApp): the application-module counterpart to androidLibrary, same AGP version.
androidApplication = { id = "com.android.application", version.ref = "agp" }
# Task 1 (:androidApp): Kotlin 2.0+ K2 Compose compiler plugin — replaces the pre-2.0
# composeOptions.kotlinCompilerExtensionVersion mechanism. Version tracks the Kotlin Gradle plugin
# 1:1, hence version.ref = "kotlin" (not a separate composeCompiler version entry).
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Task 15: applied host-guarded (macOS only) in shared/build.gradle.kts — see skie's version comment above.
skie = { id = "co.touchlab.skie", version.ref = "skie" }
