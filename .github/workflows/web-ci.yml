# Mentora — Web CI (Phase 7, Task T2/T3)
#
# WHAT THIS IS. The automated gate for `web/` — a Next.js 15 app. Two jobs: `web-static` (ESLint,
# the repo's own RTL/logical-properties gate, design-to-code drift validation, TypeScript, a
# production build — fast, always informative) and `web-e2e` (the full local stack — MongoDB +
# backend + Website — with the real Playwright suite run against it, per
# `architecture/DEPLOYMENT.md § 5`'s explicit requirement for CI-provisioned E2E). Splitting them
# means a lint/type error fails in minutes instead of tens of minutes, and a real E2E failure is
# never confused with a static one. Covers criterion I2 — a locked M16 deliverable never built until
# Phase 7 (`execution/PHASE_7_SYSTEM_DESIGN.md` § H2/§ 4).
#
# WHAT THIS IS NOT. It never drives Android or iOS, never deploys, signs, or publishes anything
# (ADR-012, criterion I6).
#
# D-E2E-BROWSER — chromium only. WebKit is known-red for a real, investigated, non-product reason
# (`execution/DECISIONS_LOG.md` D64): it applies a stricter Secure/SameSite policy over plain-HTTP
# `localhost` than Chromium/Firefox's "localhost is trustworthy" relaxation, so the session cookie is
# rejected and every authenticated flow bounces to /login. Firefox is green but roughly doubles this
# job's wall-clock for near-zero marginal signal beyond what chromium already proves. Firefox/WebKit
# remain local/manual (`web/README.md`) — this is a stated, deliberate narrowing, not a silently
# reduced suite.
#
# AI TUTOR / SECRETS: `AI_PROVIDER_API_KEY` is explicitly empty (D146, stub mode) in the E2E job. No
# `secrets.*` reference appears anywhere in this file.
#
# ACTION VERSIONS resolved against the GitHub API on 2026-09-20: checkout v7, setup-node v7,
# setup-java v6, upload-artifact v7, gradle/actions v6.
#
# WHY MONGODB IS STARTED WITH `docker run`, NOT A `services:` CONTAINER (web-e2e job) — see
# `backend-ci.yml`'s own header for the full account (multi-document transactions, no `command:` key
# on service containers, the `rs.initiate` host-pin requirement).
#
# WHY THERE IS NO `npm run build` STEP IN `web-static` (a real finding, not the original T2 design — see
# execution/DECISIONS_LOG.md D150). The landing page (`web/src/app/[locale]/(public)/page.tsx`) is
# ISR (`export const revalidate = 300`), not fully static, and Next.js still performs one real,
# live, server-side fetch to the backend during `next build`'s initial prerender pass — so `web-ci`
# cannot run a real `next build` without a live backend. `web-static` has no backend and is meant to
# stay fast; the actual production build is exercised for real by the `web-e2e` job below (which
# already needs the site built against its own live backend anyway), not duplicated here.

name: Web CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'design-system/**'
      - 'design-to-code/**'
      - 'tools/token-pipeline/generate.js'
      - 'tools/design-to-code/**'
      - '.github/workflows/web-ci.yml'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'design-system/**'
      - 'design-to-code/**'
      - 'tools/token-pipeline/generate.js'
      - 'tools/design-to-code/**'
      - '.github/workflows/web-ci.yml'
      - '!**/*.md'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-static:
    name: Web lint + type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Logical-properties check (RTL gate — no physical-direction CSS)
        run: npm run lint:logical-properties

      - name: Design-to-code validation
        run: npm run validate:design-to-code

      - name: Type-check
        run: npm run typecheck

  web-e2e:
    name: Playwright E2E (chromium) against a real local stack
    needs: web-static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONGODB_URI: 'mongodb://localhost:27017/mentora?replicaSet=rs0'
      MONGODB_DATABASE: mentora
      JWT_SIGNING_SECRET: ci-only-not-a-real-secret-signing-key-at-least-32-bytes
      MEDIA_STORAGE_ROOT: storage/media
      CORS_ALLOWED_ORIGINS: 'http://localhost:3000'
      AI_PROVIDER_API_KEY: ''
      API_BASE_URL: 'http://localhost:8080'
      E2E_BASE_URL: 'http://localhost:3000'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start MongoDB as a single-node replica set (rs0)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mentora-mongo -p 27017:27017 \
            mongo:8.0 --replSet rs0 --bind_ip_all
          echo "Waiting for mongod to accept connections..."
          for i in $(seq 1 60); do
            if docker exec mentora-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mentora-mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          echo "Waiting for PRIMARY..."
          STATE=""
          for i in $(seq 1 60); do
            STATE="$(docker exec mentora-mongo mongosh --quiet --eval 'try{rs.status().myState}catch(e){-1}' | tr -d '[:space:]')"
            [ "${STATE}" = "1" ] && break
            sleep 2
          done
          if [ "${STATE}" != "1" ]; then
            echo "::error::MongoDB replica set rs0 never reached PRIMARY (myState=${STATE})."
            docker logs mentora-mongo || true
            exit 1
          fi
          docker exec mentora-mongo mongosh --quiet --eval 'rs.status().set'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build the backend fat jar
        working-directory: backend
        run: ./gradlew --stacktrace buildFatJar

      - name: Seed demo data
        working-directory: backend
        run: ./gradlew --stacktrace seedDemoData

      - name: Start the backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup java -jar build/libs/mentora-backend.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "Backend up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy within the timeout."
          cat "$RUNNER_TEMP/backend.log" || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers (chromium)
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build the site
        working-directory: web
        run: npm run build

      - name: Start the site
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          nohup npx next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/en >/dev/null 2>&1; then
              echo "Web up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Website did not become healthy within the timeout."
          cat "$RUNNER_TEMP/web.log" || true
          exit 1

      - name: Run the suite
        working-directory: web
        run: npx playwright test --project=chromium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-report
          path: |
            web/playwright-report/**
            web/test-results/**
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/web.log
          retention-days: 7

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Web E2E summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stack | Next.js 15 (production build) + Ktor backend (stub AI provider) + MongoDB rs0 |"
            echo "| Browser project | chromium only |"
            echo ""
            echo "**firefox/webkit not run in CI — see \`execution/DECISIONS_LOG.md\` D64.** They remain"
            echo "local/manual, per \`web/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
